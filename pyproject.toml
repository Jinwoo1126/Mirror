[project]
name = "mirror"
version = "0.1.0"
description = "Mirror — 동적 그래프·온톨로지 기반 개인 이해 에이전트 (P1 그래프 MVP)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "kuzu>=0.8",
  "mcp>=1.0",
  "fastembed>=0.7",
  "starlette>=0.40",
  "uvicorn>=0.30",
  "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8"]
Muse = ["anthropic"]
ollama = ["ollama"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mirror*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
