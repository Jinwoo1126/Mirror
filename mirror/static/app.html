<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Mirror</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
<style>
/* Design: a clean app UI in the shadcn/ui and Linear tradition. One teal accent on green-tinted grays. */
:root {
  --bg: #f1f5f4; --surface: #ffffff; --surface-2: #f7faf9; --ink: #0e1e1d;
  --ink-2: #455756; --ink-3: #7b8d8b; --line: #dbe4e2; --line-2: #e9f0ee;
  --accent: #0f766e; --accent-ink: #ffffff; --accent-soft: #dcf2ee; --accent-line: #a7dcd4;
  --good: #15803d; --good-soft: #e0f3e6; --warn: #b45309; --warn-soft: #fbecd5;
  --bad: #b91c1c; --bad-soft: #fbe3e3;
  --shadow: 0 1px 2px rgba(14,30,29,.05), 0 6px 18px rgba(14,30,29,.05);
  --radius: 14px; --radius-sm: 9px;
  --f-ui: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, monospace;
  --nav-h: 0px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b1413; --surface: #111d1c; --surface-2: #162624; --ink: #e5f0ee;
    --ink-2: #9fb4b1; --ink-3: #6f8683; --line: #223534; --line-2: #1a2b2a;
    --accent: #2dd4bf; --accent-ink: #062b27; --accent-soft: #123532; --accent-line: #1f5b55;
    --good: #4ade80; --good-soft: #12301f; --warn: #fbbf24; --warn-soft: #34270d;
    --bad: #f87171; --bad-soft: #3a1818;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.6 var(--f-ui);
  -webkit-font-smoothing: antialiased; letter-spacing: -0.005em; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
i[data-lucide], svg.lucide { width: 18px; height: 18px; stroke-width: 1.9; flex: none; }

/* Layout */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); height: 100%; }
.side { background: var(--surface); border-right: 1px solid var(--line); padding: 20px 14px 14px;
  display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 11px; padding: 4px 8px 18px; }
.logo { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; font-weight: 800; font-size: 17px; letter-spacing: -.03em; }
.brand b { display: block; font-size: 17px; letter-spacing: -.02em; line-height: 1.2; }
.brand span { display: block; font-size: 12px; color: var(--ink-3); }
.grp { font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--ink-3); padding: 14px 10px 6px; text-transform: uppercase; }
.tab { display: flex; align-items: center; gap: 11px; width: 100%; padding: 9px 11px; border: 0; background: none;
  border-radius: var(--radius-sm); color: var(--ink-2); font-size: 14.5px; font-weight: 500; text-align: left; }
.tab:hover { background: var(--surface-2); color: var(--ink); }
.tab.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.status { margin-top: auto; padding: 12px; background: var(--surface-2); border: 1px solid var(--line-2);
  border-radius: var(--radius-sm); font-size: 12px; color: var(--ink-2); display: flex; flex-direction: column; gap: 8px; }
.status .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); display: inline-block; margin-right: 6px; }
.dot.off { background: var(--bad); }

.main { overflow-y: auto; padding: 0 clamp(16px, 4vw, 44px) calc(40px + var(--nav-h)); scroll-behavior: smooth; }
.page { max-width: 880px; margin: 0 auto; }
.head { padding: 32px 0 20px; }
.head h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.025em; line-height: 1.25; text-wrap: balance; }
.head p { margin: 6px 0 0; color: var(--ink-2); font-size: 14.5px; max-width: 60ch; }
section { display: none; }
section.active { display: block; animation: rise .22s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { section.active { animation: none; } * { scroll-behavior: auto !important; } }

/* Shared components */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
.card + .card { margin-top: 12px; }
.card h3 { margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--ink-2); letter-spacing: -.005em; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 38px; padding: 0 15px;
  border-radius: var(--radius-sm); border: 1px solid transparent; font-weight: 600; font-size: 14px; transition: background .15s, border-color .15s, transform .05s; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { background: var(--surface); border-color: var(--line); color: var(--ink); }
.btn.ghost:hover { border-color: var(--accent-line); background: var(--surface-2); }
.btn.sm { height: 30px; padding: 0 11px; font-size: 12.5px; }
.btn.icon { width: 34px; padding: 0; }
.btn.danger:hover { color: var(--bad); border-color: var(--bad); }
.btn:disabled { opacity: .55; cursor: default; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.input, .field select, .field textarea, .field input { width: 100%; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-sm); font-size: 15px; outline: none; transition: border-color .15s, box-shadow .15s; }
.input:focus, .field select:focus, .field textarea:focus, .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { resize: vertical; min-height: 44px; }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
  background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.pill.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px; font-size: 13px; background: var(--surface-2); border: 1px solid var(--line); }
.chip i { font-style: normal; font-size: 11.5px; color: var(--ink-3); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.id { font: 500 11px var(--f-mono); color: var(--ink-3); background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 6px; padding: 1px 6px; }
.muted { color: var(--ink-3); font-size: 13px; }
.empty { text-align: center; padding: 38px 16px; color: var(--ink-3); }
.empty .lucide { width: 30px; height: 30px; margin-bottom: 8px; color: var(--accent-line); }
.empty b { display: block; color: var(--ink-2); margin-bottom: 4px; }
.skel { height: 74px; border-radius: var(--radius); background: linear-gradient(90deg, var(--line-2), var(--surface-2), var(--line-2)); background-size: 200% 100%; animation: sh 1.2s infinite; }
@keyframes sh { to { background-position: -200% 0; } }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.search { position: relative; flex: 1; min-width: 200px; }
.search .lucide { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--ink-3); width: 17px; height: 17px; }
.search .input { padding-left: 36px; }
.switch { display: inline-flex; align-items: center; gap: 9px; font-size: 13px; color: var(--ink-2); cursor: pointer; user-select: none; }
.switch input { appearance: none; width: 34px; height: 20px; border-radius: 999px; background: var(--line); position: relative; transition: background .15s; cursor: pointer; margin: 0; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { transform: translateX(14px); }

/* Chat */
#chat .page { display: flex; flex-direction: column; min-height: calc(100vh - 150px); }
#chat-log { display: flex; flex-direction: column; gap: 16px; flex: 1; padding-bottom: 20px; }
.msg { display: flex; gap: 11px; max-width: 100%; }
.msg.user { flex-direction: row-reverse; }
.av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: none; font-size: 12px; font-weight: 700; }
.msg.bot .av { background: var(--accent); color: var(--accent-ink); }
.msg.user .av { background: var(--line); color: var(--ink-2); }
.bubble { padding: 11px 15px; border-radius: 16px; max-width: min(640px, 86%); white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; }
.msg.bot .bubble { background: var(--surface); border: 1px solid var(--line); border-top-left-radius: 5px; box-shadow: var(--shadow); }
.msg.user .bubble { background: var(--accent); color: var(--accent-ink); border-top-right-radius: 5px; }
.bubble .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; white-space: normal; }
.msg.user .btn.ghost { background: rgba(255,255,255,.2); border-color: rgba(255,255,255,.4); color: inherit; }
.msg.user .btn.ghost:hover { background: rgba(255,255,255,.3); }
.bubble .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; white-space: normal; }
.typing { display: inline-flex; gap: 4px; padding: 4px 0; }
.typing b { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); animation: bl 1s infinite; }
.typing b:nth-child(2) { animation-delay: .15s; } .typing b:nth-child(3) { animation-delay: .3s; }
@keyframes bl { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.hello { text-align: center; padding: 36px 10px 8px; }
.hello .logo { margin: 0 auto 14px; width: 46px; height: 46px; border-radius: 14px; font-size: 22px; }
.hello h2 { margin: 0 0 6px; font-size: 20px; letter-spacing: -.02em; }
.hello p { margin: 0 auto; color: var(--ink-2); max-width: 44ch; font-size: 14px; }
.hello .chips { justify-content: center; margin-top: 18px; }
.hello .chip { cursor: pointer; background: var(--surface); transition: border-color .15s; }
.hello .chip:hover { border-color: var(--accent); color: var(--accent); }
.composer { position: sticky; bottom: calc(14px + var(--nav-h)); background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  box-shadow: var(--shadow), 0 -8px 24px var(--bg); padding: 10px 10px 10px 16px; }
.composer .line { display: flex; align-items: flex-end; gap: 8px; }
.composer textarea { flex: 1; border: 0; background: none; outline: none; resize: none; padding: 8px 0; max-height: 160px; min-height: 24px; font-size: 15px; line-height: 1.5; }
.composer .opts { display: none; padding: 8px 0 2px; }
.composer .opts.on { display: block; }
.composer .opts input { width: 100%; border: 1px dashed var(--line); border-radius: 8px; padding: 7px 10px; background: var(--surface-2); outline: none; font-size: 13.5px; }
.composer .bar { display: flex; align-items: center; gap: 14px; padding: 8px 4px 0 0; margin-top: 4px; border-top: 1px solid var(--line-2); }
.composer .bar .btn.link { border: 0; background: none; height: 26px; padding: 0 6px; color: var(--ink-2); font-size: 12.5px; font-weight: 500; }
.composer .bar .btn.link.on { color: var(--accent); }

/* Memory and hypothesis lists */
.item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 9px; }
.item + .item { margin-top: 10px; }
.item .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.item .txt { font-size: 15px; word-break: keep-all; overflow-wrap: anywhere; }
.item .foot { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ev { display: flex; gap: 9px; font-size: 13.5px; color: var(--ink-2); padding: 6px 0 6px 2px; border-top: 1px solid var(--line-2); }
.ev .lucide { width: 15px; height: 15px; margin-top: 3px; }
.ev.sup .lucide { color: var(--good); } .ev.con .lucide { color: var(--bad); }
.ev small { color: var(--ink-3); font: 500 11.5px var(--f-mono); margin-right: 6px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; height: 30px; padding: 0 13px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button:hover { background: var(--surface-2); }
.seg button.ok:hover { color: var(--good); } .seg button.no:hover, .seg button.stop:hover { color: var(--bad); }

/* Profile */
.tend { padding: 11px 0; border-top: 1px solid var(--line-2); }
.tend:first-of-type { border-top: 0; padding-top: 2px; }
.tend .st { font-size: 15px; font-weight: 500; }
.tend .mt { display: flex; align-items: center; gap: 10px; margin-top: 6px; flex-wrap: wrap; }
.meter { display: inline-flex; gap: 3px; } .meter b { width: 14px; height: 6px; border-radius: 3px; background: var(--line); } .meter b.on { background: var(--accent); }
.kind { font-size: 12px; font-weight: 600; color: var(--ink-3); margin: 12px 0 7px; } .kind:first-of-type { margin-top: 0; }
.bar { display: grid; grid-template-columns: 96px 1fr 58px; align-items: center; gap: 10px; font-size: 13px; margin: 6px 0; }
.bar .t { height: 8px; background: var(--line-2); border-radius: 4px; overflow: hidden; } .bar .t div { height: 100%; background: var(--accent); border-radius: 4px; }
.bar span:last-child { text-align: right; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.pbanner { display: flex; gap: 12px; align-items: flex-start; background: var(--accent-soft); border: 1px solid var(--accent-line); color: var(--ink);
  border-radius: var(--radius); padding: 13px 16px; margin-bottom: 14px; font-size: 14px; }
.pbanner .lucide { color: var(--accent); margin-top: 2px; }
.pbanner b { display: block; }

/* Scenarios */
.scs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 10px; margin-bottom: 16px; }
.sc { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 6px; box-shadow: var(--shadow); transition: border-color .15s, transform .1s; }
.sc:hover { border-color: var(--accent-line); transform: translateY(-1px); }
.sc.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.sc .ic { width: 34px; height: 34px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.sc b { font-size: 15px; } .sc span { font-size: 12.5px; color: var(--ink-2); line-height: 1.45; }
.result { white-space: pre-wrap; font-size: 15px; line-height: 1.7; word-break: keep-all; overflow-wrap: anywhere; }
.result-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line-2); }

/* Graph */
.graphwrap { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
#cy { width: 100%; height: clamp(420px, calc(100vh - 290px), 760px); }
.legend { position: absolute; left: 12px; top: 12px; display: flex; flex-wrap: wrap; gap: 5px 12px; max-width: calc(100% - 24px);
  background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(6px); padding: 7px 11px; border-radius: 10px; border: 1px solid var(--line-2); font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend b { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.detail { margin-top: 12px; min-height: 64px; }

/* Tables and report */
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-size: 12px; font-weight: 600; color: var(--ink-3); padding: 8px 12px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 11px 12px; border-bottom: 1px solid var(--line-2); } .tbl tr:last-child td { border-bottom: 0; }
.tbl td.n { font-variant-numeric: tabular-nums; font-weight: 600; width: 64px; }
.tw { overflow-x: auto; }
.rep h3 { margin: 18px 0 8px; font-size: 14.5px; color: var(--ink); font-weight: 700; } .rep h3:first-child { margin-top: 0; }
.rep .li { display: flex; gap: 9px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line-2); font-size: 14.5px; flex-wrap: wrap; }
.rep .li small { color: var(--ink-3); font: 500 11.5px var(--f-mono); }
.rep .range { color: var(--ink-3); font: 500 12.5px var(--f-mono); }
.out { margin-top: 10px; font-size: 12.5px; color: var(--ink-2); font-family: var(--f-mono); white-space: pre-wrap; word-break: break-all; }


/* You: person card and body map */
.person { margin-bottom: 14px; } .ph { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; } .ph .pt { font-size: 16px; }
.avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.skywrap { position: relative; border-radius: var(--radius); overflow: hidden; border: 1px solid #1c2748; box-shadow: var(--shadow);
  background: radial-gradient(ellipse at 50% 30%, #14214a 0%, #0a1126 55%, #050914 100%); }
#sky { display: block; width: 100%; height: clamp(440px, 72vh, 760px); touch-action: manipulation; }
#sky .bgstar { fill: #aebbe6; opacity: .55; } #sky .bgstar.tw { animation: twinkle 3.6s ease-in-out infinite; }
@keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: .9; } }
#sky .bone { stroke: rgba(150,170,255,.32); stroke-width: 1.4; } #sky .joint { fill: #8da2ff; opacity: .6; } #sky .body { transition: opacity .5s; } #sky .body.dim { opacity: .22; }
#sky .hub { cursor: pointer; outline: none; transition: opacity .4s; } #sky .hub.off { opacity: .28; } #sky .hub.empty { opacity: .45; }
#sky .hub:hover circle:nth-child(2), #sky .hub:focus-visible circle:nth-child(2) { filter: url(#glow) brightness(1.3); }
#sky .hub:focus-visible circle:first-child { stroke: #fff; stroke-width: 2; }
#sky text { fill: #dbe4ff; font-family: var(--f-ui); paint-order: stroke; stroke: rgba(5,9,20,.8); stroke-width: calc(3px * var(--u, 1)); stroke-linejoin: round; }
#sky .hl { font-size: calc(14px * var(--u, 1)); font-weight: 700; } #sky .hs { font-size: calc(11.5px * var(--u, 1)); fill: #9fb0e8; }
#sky .sl { font-size: calc(12.5px * var(--u, 1)); } #sky .star { cursor: pointer; outline: none; }
#sky .star:focus-visible circle { stroke: #fff; stroke-width: 2; } #sky .star.pick circle:not(.decl) { stroke: #fff; stroke-width: calc(2px * var(--u, 1)); }
#sky .link { stroke: rgba(170,190,255,.35); stroke-width: calc(1.2px * var(--u, 1)); } #sky .link.hubl { stroke-dasharray: 3 4; opacity: .7; }
#sky .decl { fill: none; stroke: #ffd36e; stroke-width: calc(1.6px * var(--u, 1)); }
#sky .av-limb { fill: none; stroke: rgba(127,162,255,.5); stroke-linecap: round; stroke-linejoin: round; } #sky .av-limb.f { fill: none; stroke-width: 3; stroke: url(#avRim); }
#sky .av-skin { stroke: #162052; stroke-linecap: round; stroke-linejoin: round; fill: none; } #sky .av-skin.f, #sky ellipse.av-skin, #sky circle.av-skin, #sky rect.av-skin { fill: url(#avFill); stroke: rgba(127,162,255,.35); stroke-width: 1.5; }
#sky polyline.av-skin { stroke: #1a2766; opacity: .92; } #sky .av-scan { fill: none; stroke: url(#scan); stroke-linecap: round; } #sky .av-scan.f { fill: url(#scan); stroke: none; }
#sky .av-visor { fill: rgba(110,210,255,.2); stroke: #8fe0ff; stroke-width: 2; } #sky .av-shine { fill: none; stroke: rgba(255,255,255,.55); stroke-width: 3; stroke-linecap: round; }
#sky .av-eye { fill: #aef0ff; filter: url(#glow); } #sky .av-halo { fill: none; stroke: #ffd36e; stroke-width: 3; opacity: .85; filter: url(#glow); }

<body>
<div class="app">

<div id="toast" aria-live="polite"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const icons = () => { try { window.lucide && lucide.createIcons(); } catch (e) {} };
const JSONH = { "Content-Type": "application/json" };

  let data = {};
  try { data = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}
function toast(msg, kind) {
  const t = document.createElement("div");
  t.className = "toast" + (kind === "bad" ? " bad" : "");
  t.textContent = msg; $("toast").appendChild(t);
  setTimeout(() => t.remove(), 2600);
}
const empty = (icon, title, body) => `<div class="empty"><i data-lucide="${icon}"></i><b>${esc(title)}</b>${esc(body)}</div>`;
const skel = n => Array.from({ length: n }, () => '<div class="skel" style="margin-bottom:10px"></div>').join("");
const cites = (ids, n = 3) => !ids.length ? "" :
  `<span class="pill accent">${ids.length} evidence</span>` + ids.slice(0, n).map(c => `<span class="id">${esc(c)}</span>`).join("") +
  (ids.length > n ? `<span class="id" title="${esc(ids.slice(n).join(", "))}">+${ids.length - n}</span>` : "");
const T = {
  domain: { "취향·경험": "Taste & experience", "가치·판단": "Values & judgment", "동기·실행": "Motivation & action", "관계·지원": "Relationships & support", "자기이해·반복 주제": "Self-understanding" },
  kind: { "사람": "People", "장소": "Places", "도구": "Tools", "프로젝트": "Projects", "곡": "Tracks", "음식": "Food", "기타": "Other",
          "상태": "State", "시간대": "Time of day", "날씨": "Weather", "예산": "Budget", "동행": "Company" },
  intent: { "정보 정리": "Organize info", "결정 도움": "Decision help", "감정 대화": "Emotional talk", "실행 요청": "Action request" },
};
const tr = (m, k) => (T[m] && T[m][k]) || k;
const day = s => (s || "").slice(0, 10);

/* Tabs */
const PAGES = {
  chat: ["Chat", "Answers from your memories and shows the evidence it used."],
  scen: ["Scenarios", "Everyday tasks like writing, music, planning and choosing, helped by what Mirror knows about you."],
  profile: ["You", "A map of what Mirror knows, by part of the body. Tap a part to fly in. Nothing here labels your personality."],
  hyps: ["Hypotheses", "Patterns that repeat across your memories, with evidence. Tell Mirror when one is wrong."],
  graph: ["Graph", "How memories, things, situations and hypotheses connect."],
  rel: ["Relation vocabulary", "Relationship phrases collected from your memories."],
  report: ["Weekly report", "How Mirror's understanding changed this week."],
};
function showTab(name) {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x.dataset.tab === name));
  document.querySelectorAll("main section").forEach(x => x.classList.toggle("active", x.id === name));
  $("ptitle").textContent = PAGES[name][0]; $("psub").textContent = PAGES[name][1];
  $("psub").style.display = PAGES[name][1] ? "" : "none";
  ({ profile: loadProfile, scen: loadScen, graph: loadGraph,
     hyps: loadHyps, rel: loadRels, report: loadReport }[name] || (() => {}))();
  document.querySelector(".main").scrollTo({ top: 0 });
  try { history.replaceState(null, "", "#" + name); } catch (e) {}
}
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => showTab(b.dataset.tab)));

async function loadStatus() {
  try {
    const s = await api("/api/status");
    $("status").innerHTML = `<div class="row"><span><span class="dot"></span>Connected</span><span class="id">rev ${s.revision}</span></div>
      <div class="row"><span>Memories</span><b>${s.counts.Observation}</b></div>
      <div class="row"><span>Hypotheses</span><b>${s.counts.Hypothesis}</b></div>
      <div class="row"><span>Search</span><span class="pill accent">${esc(s.index_mode)}</span></div>
      <div class="row"><span>Answers</span><span class="pill ${s.llm_backend ? "good" : "warn"}">${esc(s.llm_backend || s.extractor)}</span></div>`;
  } catch (e) { $("status").innerHTML = '<span class="dot off"></span>Offline'; }
}

/* Chat */
const SUGGEST = ["What do I usually pick for dinner when I'm tired?", "Where have I been going lately?", "When do I tend to try new things?"];
function hello() {
  $("chat-log").innerHTML = `<div class="hello"><div class="logo">M</div><h2>How can I help?</h2>
    <p>Tell me what happened and I will remember it. Ask a question and I will answer from your memories, with evidence.</p>
    <div class="chips">${SUGGEST.map(q => `<span class="chip" data-q="${esc(q)}">${esc(q)}</span>`).join("")}</div></div>`;
  $("chat-log").querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => { $("chat-in").value = c.dataset.q; sendChat(); }));
}
function addMsg(cls, text, saveText) {
  $("chat-log").querySelector(".hello")?.remove();
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.innerHTML = `<div class="av">${cls === "user" ? "Me" : "M"}</div><div class="bubble"><div class="body">${esc(text)}</div></div>`;
  if (saveText) {
    const act = document.createElement("div"); act.className = "actions";
    const b = document.createElement("button"); b.className = "btn ghost sm";
    b.innerHTML = '<i data-lucide="bookmark-plus"></i>Save to memory';
    b.addEventListener("click", async () => {
      try { await api("/api/memories", { method: "POST", headers: JSONH, body: JSON.stringify({ text: saveText }) });
        b.innerHTML = "Saved"; b.disabled = true; toast("Saved to memory"); loadStatus();
      } catch (e) { toast("Could not save: " + e.message, "bad"); }
    });
    act.appendChild(b); div.querySelector(".bubble").appendChild(act);
  }
  $("chat-log").appendChild(div); icons();
  $("chat-log").lastElementChild.scrollIntoView({ block: "end", behavior: "smooth" });
  return div;
}
async function sendChat() {
  const text = $("chat-in").value.trim();
  if (!text) return;
  $("chat-in").value = ""; autosize();
  const optsRaw = $("chat-opts").value.trim();
  const options = optsRaw ? optsRaw.split(",").map(s => s.trim()).filter(Boolean) : null;
  addMsg("user", text, text);
  if ($("auto-mem").checked) {
    try { await api("/api/memories", { method: "POST", headers: JSONH, body: JSON.stringify({ text }) }); loadStatus(); }
    catch (e) { toast("Auto-save failed: " + e.message, "bad"); }
  }
  const wait = addMsg("bot", "");
  wait.querySelector(".body").innerHTML = '<span class="typing"><b></b><b></b><b></b></span>';
  $("chat-send").disabled = true;
  try {
    const r = await api("/api/chat", { method: "POST", headers: JSONH, body: JSON.stringify({ message: text, options }) });
    wait.querySelector(".body").textContent = r.text;
    const bub = wait.querySelector(".bubble");
    const meta = document.createElement("div"); meta.className = "meta";
    meta.innerHTML = `<span class="pill ${r.mode === "local" ? "warn" : "good"}">${esc(r.mode)}</span><span class="pill">${esc(tr("intent", r.decision.intent))}</span>` +
      cites(r.citations || []);
    bub.appendChild(meta);
    const prop = r.proposal && r.proposal.intervention;
    if (prop && prop.level === 1 && prop.options_presented.length) {
      const box = document.createElement("div"); box.className = "actions";
      prop.options_presented.forEach(o => {
        const b = document.createElement("button"); b.className = "btn ghost sm"; b.textContent = o;
        b.addEventListener("click", () => { $("chat-in").value = `I choose: ${o}`; sendChat(); });
        box.appendChild(b);
      });
      bub.appendChild(box);
    }
  } catch (e) { wait.querySelector(".body").textContent = "Error: " + e.message; }

}
function autosize() { const t = $("chat-in"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 160) + "px"; }
$("chat-in").addEventListener("input", autosize);
$("chat-in").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendChat(); } });
$("chat-send").addEventListener("click", sendChat);
$("opts-toggle").addEventListener("click", () => { const on = $("opts-box").classList.toggle("on"); $("opts-toggle").classList.toggle("on", on); if (on) $("chat-opts").focus(); });

/* You: a person card and a body-map constellation you fly around in */
const BODY = {
  brain: { x: 500, y: 112, hue: 262 }, ears: { x: 592, y: 198, hue: 200 }, eyes: { x: 408, y: 198, hue: 172 },
  mouth: { x: 500, y: 268, hue: 14 }, heart: { x: 500, y: 400, hue: 346 }, hands: { x: 316, y: 566, hue: 44 }, feet: { x: 500, y: 884, hue: 140 },
};
const JOINTS = { neck: [500, 300], shL: [410, 346], shR: [590, 346], elL: [356, 458], elR: [644, 458], haL: [316, 566], haR: [684, 566],
  waist: [500, 540], hipL: [455, 604], hipR: [545, 604], knL: [446, 736], knR: [554, 736], ftL: [432, 862], ftR: [568, 862] };
const BONES = [["neck", "shL"], ["neck", "shR"], ["shL", "elL"], ["elL", "haL"], ["shR", "elR"], ["elR", "haR"], ["neck", "waist"], ["shL", "waist"],
  ["shR", "waist"], ["waist", "hipL"], ["waist", "hipR"], ["hipL", "knL"], ["knL", "ftL"], ["hipR", "knR"], ["knR", "ftR"]];
const HEAD = { x: 500, y: 200, r: 88 };
const ABOUT_PROMPTS = ["I am ", "When I choose between options, I usually ", "I eat ", "I listen to ", "I write ", "When I am stressed, I ", "I like to go ", "I never "];
const SKY = { map: null, sel: null, star: null, view: null, anim: 0, avatar: null };
const hsl = (h, l = 64, a = 1) => `hsla(${h}, 85%, ${l}%, ${a})`;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };
const clip = (t, n) => t.length > n ? t.slice(0, n - 1) + "…" : t;

function skySize() { const r = $("sky").getBoundingClientRect(); return { w: r.width || 800, h: r.height || 560 }; }
function overview() { const { w, h } = skySize(); return { cx: 500, cy: 530, w: Math.max(900, 1100 * (w / h)) }; }
function applyView(v) {
  const { w, h } = skySize(); const vh = v.w * (h / w);
  $("sky").setAttribute("viewBox", `${v.cx - v.w / 2} ${v.cy - vh / 2} ${v.w} ${vh}`);
  $("sky").style.setProperty("--u", (v.w / w).toFixed(4));
  SKY.view = v;
}
function fly(target) {
  cancelAnimationFrame(SKY.anim);
  const from = SKY.view || target;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { applyView(target); return; }
  const t0 = performance.now(), dur = 750;
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const step = now => {
    const k = ease(Math.min(1, (now - t0) / dur));
    applyView({ cx: from.cx + (target.cx - from.cx) * k, cy: from.cy + (target.cy - from.cy) * k, w: from.w + (target.w - from.w) * k });
    if (k < 1) SKY.anim = requestAnimationFrame(step);
  };
  SKY.anim = requestAnimationFrame(step);
}
function regionOf(id) { return SKY.map.regions.find(r => r.id === id); }
function starPos(region, i) {
  const h = BODY[region.id]; const a = i * 2.399963 + (region.id.charCodeAt(0) % 7);
  const rad = 66 + 27 * Math.sqrt(i);
  return [h.x + Math.cos(a) * rad, h.y + Math.sin(a) * rad];
}
function avatarSvg() {
  const J = JOINTS, pl = pts => pts.map(p => p.join(",")).join(" ");
  const limb = (pts, w) => `<polyline class="av-limb" points="${pl(pts)}" stroke-width="${w + 7}"/><polyline class="av-skin" points="${pl(pts)}" stroke-width="${w}"/><polyline class="av-scan" points="${pl(pts)}" stroke-width="${w}"/>`;
  const TORSO = "M414 334 Q500 306 586 334 Q580 452 548 568 Q500 588 452 568 Q420 452 414 334 Z";
  let o = `<ellipse class="av-pad" cx="500" cy="892" rx="170" ry="26"/><ellipse class="av-pad b" cx="500" cy="892" rx="118" ry="17"/><ellipse class="av-pad b" cx="500" cy="892" rx="66" ry="9"/>`;
  o += limb([J.shL, J.elL, J.haL], 30) + limb([J.shR, J.elR, J.haR], 30) + limb([J.hipL, J.knL, J.ftL], 44) + limb([J.hipR, J.knR, J.ftR], 44);
  o += `<ellipse class="av-skin" cx="${J.ftL[0] - 4}" cy="${J.ftL[1] + 14}" rx="30" ry="13"/><ellipse class="av-skin" cx="${J.ftR[0] + 4}" cy="${J.ftR[1] + 14}" rx="30" ry="13"/>`;
  o += `<circle class="av-skin" cx="${J.haL[0]}" cy="${J.haL[1] + 10}" r="24"/><circle class="av-skin" cx="${J.haR[0]}" cy="${J.haR[1] + 10}" r="24"/>`;
  o += `<rect class="av-skin" x="480" y="284" width="40" height="34" rx="12"/>`;
  o += `<path class="av-limb f" d="${TORSO}"/><path class="av-skin f" d="${TORSO}"/><path class="av-scan f" d="${TORSO}"/>`;
  o += `<circle class="av-skin f" cx="${HEAD.x}" cy="${HEAD.y}" r="${HEAD.r}"/><circle class="av-limb f" cx="${HEAD.x}" cy="${HEAD.y}" r="${HEAD.r}"/><circle class="av-scan f" cx="${HEAD.x}" cy="${HEAD.y}" r="${HEAD.r}"/>`;
  o += `<rect class="av-visor" x="424" y="174" width="152" height="52" rx="26"/><path class="av-shine" d="M446 188 Q500 176 548 188"/><circle class="av-eye" cx="474" cy="200" r="5"/><circle class="av-eye" cx="526" cy="200" r="5"/>`;
  o += `<ellipse class="av-halo" cx="500" cy="92" rx="64" ry="12"/>`;
  o += `<circle class="av-core" cx="500" cy="400" r="30"/><circle class="av-core b" cx="500" cy="400" r="18"/>`;
  o += `<path class="av-seam" d="M500 308 L500 372 M500 428 L500 566 M448 470 Q500 492 552 470"/>`;
  return o;

function renderSky() {

/* Report */
function renderMd(md) {
  const lines = (md || "").split("\n"); let html = "";
  lines.forEach(l => {
    if (!l.trim()) return;
    if (l.startsWith("# ")) return;
    if (l.startsWith("## ")) html += `<h3>${esc(l.slice(3))}</h3>`;
    else if (l.startsWith("- ")) {
      const m = l.slice(2).match(/^\[(\w+)\]\s*(.*?)(?:\s*\((evidence[^)]*)\))?$/);
      html += m ? `<div class="li"><span class="pill ${m[1] === "active" ? "good" : "warn"}">${esc(m[1])}</span><span>${esc(m[2])}</span><small>${esc(m[3] || "")}</small></div>` : `<div class="li">${esc(l.slice(2))}</div>`;
    } else if (/^\d{4}-\d\d-\d\d/.test(l)) html += `<div class="range">${esc(l)}</div>`;
    else html += `<div class="muted" style="margin-top:12px">${esc(l)}</div>`;
  });
  return html || empty("clipboard-check", "Nothing changed this week", "");
}

  icons();
}
