<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Mirror</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
<style>
/* Design: a clean app UI in the shadcn/ui and Linear tradition. One teal accent on green-tinted grays. */
:root {
  --bg: #f1f5f4; --surface: #ffffff; --surface-2: #f7faf9; --ink: #0e1e1d;
  --ink-2: #455756; --ink-3: #7b8d8b; --line: #dbe4e2; --line-2: #e9f0ee;
  --accent: #0f766e; --accent-ink: #ffffff; --accent-soft: #dcf2ee; --accent-line: #a7dcd4;
  --good: #15803d; --good-soft: #e0f3e6; --warn: #b45309; --warn-soft: #fbecd5;
  --bad: #b91c1c; --bad-soft: #fbe3e3;
  --shadow: 0 1px 2px rgba(14,30,29,.05), 0 6px 18px rgba(14,30,29,.05);
  --radius: 14px; --radius-sm: 9px;
  --f-ui: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, monospace;
  --nav-h: 0px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b1413; --surface: #111d1c; --surface-2: #162624; --ink: #e5f0ee;
    --ink-2: #9fb4b1; --ink-3: #6f8683; --line: #223534; --line-2: #1a2b2a;
    --accent: #2dd4bf; --accent-ink: #062b27; --accent-soft: #123532; --accent-line: #1f5b55;
    --good: #4ade80; --good-soft: #12301f; --warn: #fbbf24; --warn-soft: #34270d;
    --bad: #f87171; --bad-soft: #3a1818;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.6 var(--f-ui);
  -webkit-font-smoothing: antialiased; letter-spacing: -0.005em; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
i[data-lucide], svg.lucide { width: 18px; height: 18px; stroke-width: 1.9; flex: none; }

/* Layout */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); height: 100%; }
.side { background: var(--surface); border-right: 1px solid var(--line); padding: 20px 14px 14px;
  display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 11px; padding: 4px 8px 18px; }
.logo { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; font-weight: 800; font-size: 17px; letter-spacing: -.03em; }
.brand b { display: block; font-size: 17px; letter-spacing: -.02em; line-height: 1.2; }
.brand span { display: block; font-size: 12px; color: var(--ink-3); }
.grp { font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--ink-3); padding: 14px 10px 6px; text-transform: uppercase; }
.tab { display: flex; align-items: center; gap: 11px; width: 100%; padding: 9px 11px; border: 0; background: none;
  border-radius: var(--radius-sm); color: var(--ink-2); font-size: 14.5px; font-weight: 500; text-align: left; }
.tab:hover { background: var(--surface-2); color: var(--ink); }
.tab.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.status { margin-top: auto; padding: 12px; background: var(--surface-2); border: 1px solid var(--line-2);
  border-radius: var(--radius-sm); font-size: 12px; color: var(--ink-2); display: flex; flex-direction: column; gap: 8px; }
.status .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); display: inline-block; margin-right: 6px; }
.dot.off { background: var(--bad); }

.main { overflow-y: auto; padding: 0 clamp(16px, 4vw, 44px) calc(40px + var(--nav-h)); scroll-behavior: smooth; }
.page { max-width: 880px; margin: 0 auto; }
.head { padding: 32px 0 20px; }
.head h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.025em; line-height: 1.25; text-wrap: balance; }
.head p { margin: 6px 0 0; color: var(--ink-2); font-size: 14.5px; max-width: 60ch; }
section { display: none; }
section.active { display: block; animation: rise .22s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { section.active { animation: none; } * { scroll-behavior: auto !important; } }

/* Shared components */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
.card + .card { margin-top: 12px; }
.card h3 { margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--ink-2); letter-spacing: -.005em; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 38px; padding: 0 15px;
  border-radius: var(--radius-sm); border: 1px solid transparent; font-weight: 600; font-size: 14px; transition: background .15s, border-color .15s, transform .05s; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { background: var(--surface); border-color: var(--line); color: var(--ink); }
.btn.ghost:hover { border-color: var(--accent-line); background: var(--surface-2); }
.btn.sm { height: 30px; padding: 0 11px; font-size: 12.5px; }
.btn.icon { width: 34px; padding: 0; }
.btn.danger:hover { color: var(--bad); border-color: var(--bad); }
.btn:disabled { opacity: .55; cursor: default; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.input, .field select, .field textarea, .field input { width: 100%; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-sm); font-size: 15px; outline: none; transition: border-color .15s, box-shadow .15s; }
.input:focus, .field select:focus, .field textarea:focus, .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { resize: vertical; min-height: 44px; }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
  background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.pill.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px; font-size: 13px; background: var(--surface-2); border: 1px solid var(--line); }
.chip i { font-style: normal; font-size: 11.5px; color: var(--ink-3); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.id { font: 500 11px var(--f-mono); color: var(--ink-3); background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 6px; padding: 1px 6px; }
.muted { color: var(--ink-3); font-size: 13px; }
.empty { text-align: center; padding: 38px 16px; color: var(--ink-3); }
.empty .lucide { width: 30px; height: 30px; margin-bottom: 8px; color: var(--accent-line); }
.empty b { display: block; color: var(--ink-2); margin-bottom: 4px; }
.skel { height: 74px; border-radius: var(--radius); background: linear-gradient(90deg, var(--line-2), var(--surface-2), var(--line-2)); background-size: 200% 100%; animation: sh 1.2s infinite; }
@keyframes sh { to { background-position: -200% 0; } }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.search { position: relative; flex: 1; min-width: 200px; }
.search .lucide { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--ink-3); width: 17px; height: 17px; }
.search .input { padding-left: 36px; }
.switch { display: inline-flex; align-items: center; gap: 9px; font-size: 13px; color: var(--ink-2); cursor: pointer; user-select: none; }
.switch input { appearance: none; width: 34px; height: 20px; border-radius: 999px; background: var(--line); position: relative; transition: background .15s; cursor: pointer; margin: 0; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { transform: translateX(14px); }

/* Chat */
#chat .page { display: flex; flex-direction: column; min-height: calc(100vh - 150px); }
#chat-log { display: flex; flex-direction: column; gap: 16px; flex: 1; padding-bottom: 20px; }
.msg { display: flex; gap: 11px; max-width: 100%; }
.msg.user { flex-direction: row-reverse; }
.av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: none; font-size: 12px; font-weight: 700; }
.msg.bot .av { background: var(--accent); color: var(--accent-ink); }
.msg.user .av { background: var(--line); color: var(--ink-2); }
.bubble { padding: 11px 15px; border-radius: 16px; max-width: min(640px, 86%); white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; }
.msg.bot .bubble { background: var(--surface); border: 1px solid var(--line); border-top-left-radius: 5px; box-shadow: var(--shadow); }
.msg.user .bubble { background: var(--accent); color: var(--accent-ink); border-top-right-radius: 5px; }
.bubble .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; white-space: normal; }
.msg.user .btn.ghost { background: rgba(255,255,255,.2); border-color: rgba(255,255,255,.4); color: inherit; }
.msg.user .btn.ghost:hover { background: rgba(255,255,255,.3); }
.bubble .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; white-space: normal; }
.typing { display: inline-flex; gap: 4px; padding: 4px 0; }
.typing b { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); animation: bl 1s infinite; }
.typing b:nth-child(2) { animation-delay: .15s; } .typing b:nth-child(3) { animation-delay: .3s; }
@keyframes bl { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.hello { text-align: center; padding: 36px 10px 8px; }
.hello .logo { margin: 0 auto 14px; width: 46px; height: 46px; border-radius: 14px; font-size: 22px; }
.hello h2 { margin: 0 0 6px; font-size: 20px; letter-spacing: -.02em; }
.hello p { margin: 0 auto; color: var(--ink-2); max-width: 44ch; font-size: 14px; }
.hello .chips { justify-content: center; margin-top: 18px; }
.hello .chip { cursor: pointer; background: var(--surface); transition: border-color .15s; }
.hello .chip:hover { border-color: var(--accent); color: var(--accent); }
.composer { position: sticky; bottom: calc(14px + var(--nav-h)); background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  box-shadow: var(--shadow), 0 -8px 24px var(--bg); padding: 10px 10px 10px 16px; }
.composer .line { display: flex; align-items: flex-end; gap: 8px; }
.composer textarea { flex: 1; border: 0; background: none; outline: none; resize: none; padding: 8px 0; max-height: 160px; min-height: 24px; font-size: 15px; line-height: 1.5; }
.composer .opts { display: none; padding: 8px 0 2px; }
.composer .opts.on { display: block; }
.composer .opts input { width: 100%; border: 1px dashed var(--line); border-radius: 8px; padding: 7px 10px; background: var(--surface-2); outline: none; font-size: 13.5px; }
.composer .bar { display: flex; align-items: center; gap: 14px; padding: 8px 4px 0 0; margin-top: 4px; border-top: 1px solid var(--line-2); }
.composer .bar .btn.link { border: 0; background: none; height: 26px; padding: 0 6px; color: var(--ink-2); font-size: 12.5px; font-weight: 500; }
.composer .bar .btn.link.on { color: var(--accent); }

/* Memory and hypothesis lists */
.item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 9px; }
.item + .item { margin-top: 10px; }
.item .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.item .txt { font-size: 15px; word-break: keep-all; overflow-wrap: anywhere; }
.item .foot { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ev { display: flex; gap: 9px; font-size: 13.5px; color: var(--ink-2); padding: 6px 0 6px 2px; border-top: 1px solid var(--line-2); }
.ev .lucide { width: 15px; height: 15px; margin-top: 3px; }
.ev.sup .lucide { color: var(--good); } .ev.con .lucide { color: var(--bad); }
.ev small { color: var(--ink-3); font: 500 11.5px var(--f-mono); margin-right: 6px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; height: 30px; padding: 0 13px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button:hover { background: var(--surface-2); }
.seg button.ok:hover { color: var(--good); } .seg button.no:hover, .seg button.stop:hover { color: var(--bad); }

/* Profile */
.tend { padding: 11px 0; border-top: 1px solid var(--line-2); }
.tend:first-of-type { border-top: 0; padding-top: 2px; }
.tend .st { font-size: 15px; font-weight: 500; }
.tend .mt { display: flex; align-items: center; gap: 10px; margin-top: 6px; flex-wrap: wrap; }
.meter { display: inline-flex; gap: 3px; } .meter b { width: 14px; height: 6px; border-radius: 3px; background: var(--line); } .meter b.on { background: var(--accent); }
.kind { font-size: 12px; font-weight: 600; color: var(--ink-3); margin: 12px 0 7px; } .kind:first-of-type { margin-top: 0; }
.bar { display: grid; grid-template-columns: 96px 1fr 58px; align-items: center; gap: 10px; font-size: 13px; margin: 6px 0; }
.bar .t { height: 8px; background: var(--line-2); border-radius: 4px; overflow: hidden; } .bar .t div { height: 100%; background: var(--accent); border-radius: 4px; }
.bar span:last-child { text-align: right; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.pbanner { display: flex; gap: 12px; align-items: flex-start; background: var(--accent-soft); border: 1px solid var(--accent-line); color: var(--ink);
  border-radius: var(--radius); padding: 13px 16px; margin-bottom: 14px; font-size: 14px; }
.pbanner .lucide { color: var(--accent); margin-top: 2px; }
.pbanner b { display: block; }

/* Scenarios */
.scs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr)); gap: 10px; margin-bottom: 16px; }
.sc { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 6px; box-shadow: var(--shadow); transition: border-color .15s, transform .1s; }
.sc:hover { border-color: var(--accent-line); transform: translateY(-1px); }
.sc.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.sc .ic { width: 34px; height: 34px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.sc b { font-size: 15px; } .sc span { font-size: 12.5px; color: var(--ink-2); line-height: 1.45; }
.result { white-space: pre-wrap; font-size: 15px; line-height: 1.7; word-break: keep-all; overflow-wrap: anywhere; }
.result-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line-2); }

/* Graph */
.graphwrap { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
#cy { width: 100%; height: clamp(420px, calc(100vh - 290px), 760px); }
.legend { position: absolute; left: 12px; top: 12px; display: flex; flex-wrap: wrap; gap: 5px 12px; max-width: calc(100% - 24px);
  background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(6px); padding: 7px 11px; border-radius: 10px; border: 1px solid var(--line-2); font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend b { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.detail { margin-top: 12px; min-height: 64px; }

/* Tables and report */
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-size: 12px; font-weight: 600; color: var(--ink-3); padding: 8px 12px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 11px 12px; border-bottom: 1px solid var(--line-2); } .tbl tr:last-child td { border-bottom: 0; }
.tbl td.n { font-variant-numeric: tabular-nums; font-weight: 600; width: 64px; }
.tw { overflow-x: auto; }
.rep h3 { margin: 18px 0 8px; font-size: 14.5px; color: var(--ink); font-weight: 700; } .rep h3:first-child { margin-top: 0; }
.rep .li { display: flex; gap: 9px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line-2); font-size: 14.5px; flex-wrap: wrap; }
.rep .li small { color: var(--ink-3); font: 500 11.5px var(--f-mono); }
.rep .range { color: var(--ink-3); font: 500 12.5px var(--f-mono); }
.out { margin-top: 10px; font-size: 12.5px; color: var(--ink-2); font-family: var(--f-mono); white-space: pre-wrap; word-break: break-all; }

/* Toasts */
#toast { position: fixed; left: 50%; bottom: calc(24px + var(--nav-h) + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 13.5px; font-weight: 500; box-shadow: 0 8px 28px rgba(0,0,0,.25); animation: rise .2s ease both; }
.toast.bad { background: var(--bad); color: #fff; }

/* Mobile: bottom tab bar */
@media (max-width: 860px) {
  :root { --nav-h: calc(62px + env(safe-area-inset-bottom, 0px)); }
  .app { display: block; height: 100%; }
  .main { height: 100%; padding-bottom: calc(24px + var(--nav-h)); }
  .side { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; top: auto; flex-direction: row; gap: 2px; padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
    border-right: 0; border-top: 1px solid var(--line); overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .side::-webkit-scrollbar { display: none; }
  .brand, .grp, .status { display: none; }
  .tab { flex: 0 0 auto; flex-direction: column; gap: 3px; width: auto; min-width: 66px; padding: 7px 9px; font-size: 11.5px; text-align: center; justify-content: center; }
  .head { padding: 22px 0 14px; } .head h1 { font-size: 22px; }
  #chat .page { min-height: calc(100vh - 130px); }
  .bubble { max-width: 90%; }
  .bar { grid-template-columns: 84px 1fr 50px; }
}
</style>
</head>
<body>
<div class="app">
<nav class="side" aria-label="Menu">
  <div class="brand"><div class="logo">M</div><div><b>Mirror</b><span>Memory that understands you</span></div></div>
  <div class="grp">Talk</div>
  <button class="tab active" data-tab="chat"><i data-lucide="message-circle"></i>Chat</button>
  <button class="tab" data-tab="scen"><i data-lucide="sparkles"></i>Scenarios</button>
  <div class="grp">You</div>
  <button class="tab" data-tab="profile"><i data-lucide="user-round"></i>Profile</button>
  <button class="tab" data-tab="mem"><i data-lucide="library"></i>Memory</button>
  <button class="tab" data-tab="hyps"><i data-lucide="lightbulb"></i>Hypotheses</button>
  <div class="grp">Structure</div>
  <button class="tab" data-tab="graph"><i data-lucide="share-2"></i>Graph</button>
  <button class="tab" data-tab="rel"><i data-lucide="link-2"></i>Relations</button>
  <button class="tab" data-tab="report"><i data-lucide="clipboard-check"></i>Weekly report</button>
  <div class="status" id="status">Connecting...</div>
</nav>

<main class="main"><div class="page">
<div class="head"><h1 id="ptitle">Chat</h1><p id="psub"></p></div>

<section id="chat" class="active">
  <div id="chat-log"></div>
  <div class="composer">
    <div class="line">
      <textarea id="chat-in" rows="1" placeholder="Ask something, or tell me what happened"></textarea>
      <button class="btn primary icon" id="chat-send" aria-label="Send"><i data-lucide="arrow-up"></i></button>
    </div>
    <div class="opts" id="opts-box"><input id="chat-opts" type="text" placeholder="Separate options with commas to compare them (e.g. fried chicken, pho)"></div>
    <div class="bar">
      <label class="switch"><input type="checkbox" id="auto-mem"> Auto-save my messages</label>
      <button class="btn link" id="opts-toggle" type="button"><i data-lucide="git-compare"></i>Compare options</button>
    </div>
  </div>
</section>

<section id="profile"><div id="profile-body"></div></section>

<section id="scen">
  <div class="scs" id="scen-pick"></div>
  <div id="scen-form"></div>
  <div id="scen-out"></div>
</section>

<section id="mem">
  <div class="card" style="margin-bottom:14px">
    <div class="field" style="margin-bottom:10px"><label for="mem-add">New memory</label>
      <textarea id="mem-add" rows="2" placeholder="Write what happened in a sentence or two"></textarea></div>
    <button class="btn primary" id="mem-add-btn"><i data-lucide="plus"></i>Add memory</button>
  </div>
  <div class="toolbar"><div class="search"><i data-lucide="search"></i><input class="input" id="mem-q" type="text" placeholder="Search memories"></div>
    <button class="btn ghost" id="mem-search">Search</button></div>
  <div id="mem-list"></div>
</section>

<section id="graph">
  <div class="graphwrap"><div id="cy"></div><div class="legend" id="legend"></div></div>
  <div class="card detail" id="cy-note"><span class="muted">Tap a node to see what it connects to.</span></div>
</section>

<section id="hyps"><div id="hyp-list"></div></section>
<section id="rel"><div class="card" id="rel-list"></div></section>

<section id="report">
  <div class="toolbar">
    <button class="btn ghost sm" id="m-nightly"><i data-lucide="moon"></i>Nightly consolidation</button>
    <button class="btn ghost sm" id="m-weekly"><i data-lucide="calendar-check"></i>Weekly review</button>
    <button class="btn ghost sm" id="m-promote"><i data-lucide="arrow-up-circle"></i>Promote</button>
  </div>
  <div class="card rep" id="report-body"></div>
  <div class="out" id="m-out"></div>
</section>
</div></main>
</div>
<div id="toast" aria-live="polite"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const icons = () => { try { window.lucide && lucide.createIcons(); } catch (e) {} };
const JSONH = { "Content-Type": "application/json" };
async function api(path, opts) {
  const r = await fetch(path, opts);
  let data = {};
  try { data = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}
function toast(msg, kind) {
  const t = document.createElement("div");
  t.className = "toast" + (kind === "bad" ? " bad" : "");
  t.textContent = msg; $("toast").appendChild(t);
  setTimeout(() => t.remove(), 2600);
}
const empty = (icon, title, body) => `<div class="empty"><i data-lucide="${icon}"></i><b>${esc(title)}</b>${esc(body)}</div>`;
const skel = n => Array.from({ length: n }, () => '<div class="skel" style="margin-bottom:10px"></div>').join("");
const cites = (ids, n = 3) => !ids.length ? "" :
  `<span class="pill accent">${ids.length} evidence</span>` + ids.slice(0, n).map(c => `<span class="id">${esc(c)}</span>`).join("") +
  (ids.length > n ? `<span class="id" title="${esc(ids.slice(n).join(", "))}">+${ids.length - n}</span>` : "");
const T = {
  domain: { "취향·경험": "Taste & experience", "가치·판단": "Values & judgment", "동기·실행": "Motivation & action", "관계·지원": "Relationships & support", "자기이해·반복 주제": "Self-understanding" },
  kind: { "사람": "People", "장소": "Places", "도구": "Tools", "프로젝트": "Projects", "곡": "Tracks", "음식": "Food", "기타": "Other",
          "상태": "State", "시간대": "Time of day", "날씨": "Weather", "예산": "Budget", "동행": "Company" },
  intent: { "정보 정리": "Organize info", "결정 도움": "Decision help", "감정 대화": "Emotional talk", "실행 요청": "Action request" },
};
const tr = (m, k) => (T[m] && T[m][k]) || k;
const day = s => (s || "").slice(0, 10);

/* Tabs */
const PAGES = {
  chat: ["Chat", "Answers from your memories and shows the evidence it used."],
  scen: ["Scenarios", "Everyday tasks like writing, music, planning and choosing, helped by what Mirror knows about you."],
  profile: ["Your profile", "Only what can be counted from saved memories. It never labels your personality or type."],
  mem: ["Memory", "Everything saved so far. Deleting one also removes what was learned from it."],
  hyps: ["Hypotheses", "Patterns that repeat across your memories, with evidence. Tell Mirror when one is wrong."],
  graph: ["Graph", "How memories, things, situations and hypotheses connect."],
  rel: ["Relation vocabulary", "Relationship phrases collected from your memories."],
  report: ["Weekly report", "How Mirror's understanding changed this week."],
};
function showTab(name) {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x.dataset.tab === name));
  document.querySelectorAll("main section").forEach(x => x.classList.toggle("active", x.id === name));
  $("ptitle").textContent = PAGES[name][0]; $("psub").textContent = PAGES[name][1];
  $("psub").style.display = PAGES[name][1] ? "" : "none";
  ({ profile: loadProfile, scen: loadScen, mem: () => loadMems($("mem-q").value), graph: loadGraph,
     hyps: loadHyps, rel: loadRels, report: loadReport }[name] || (() => {}))();
  document.querySelector(".main").scrollTo({ top: 0 });
  try { history.replaceState(null, "", "#" + name); } catch (e) {}
}
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => showTab(b.dataset.tab)));

async function loadStatus() {
  try {
    const s = await api("/api/status");
    $("status").innerHTML = `<div class="row"><span><span class="dot"></span>Connected</span><span class="id">rev ${s.revision}</span></div>
      <div class="row"><span>Memories</span><b>${s.counts.Observation}</b></div>
      <div class="row"><span>Hypotheses</span><b>${s.counts.Hypothesis}</b></div>
      <div class="row"><span>Search</span><span class="pill accent">${esc(s.index_mode)}</span></div>
      <div class="row"><span>Answers</span><span class="pill ${s.llm_backend ? "good" : "warn"}">${esc(s.llm_backend || s.extractor)}</span></div>`;
  } catch (e) { $("status").innerHTML = '<span class="dot off"></span>Offline'; }
}

/* Chat */
const SUGGEST = ["What do I usually pick for dinner when I'm tired?", "Where have I been going lately?", "When do I tend to try new things?"];
function hello() {
  $("chat-log").innerHTML = `<div class="hello"><div class="logo">M</div><h2>How can I help?</h2>
    <p>Tell me what happened and I will remember it. Ask a question and I will answer from your memories, with evidence.</p>
    <div class="chips">${SUGGEST.map(q => `<span class="chip" data-q="${esc(q)}">${esc(q)}</span>`).join("")}</div></div>`;
  $("chat-log").querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => { $("chat-in").value = c.dataset.q; sendChat(); }));
}
function addMsg(cls, text, saveText) {
  $("chat-log").querySelector(".hello")?.remove();
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.innerHTML = `<div class="av">${cls === "user" ? "Me" : "M"}</div><div class="bubble"><div class="body">${esc(text)}</div></div>`;
  if (saveText) {
    const act = document.createElement("div"); act.className = "actions";
    const b = document.createElement("button"); b.className = "btn ghost sm";
    b.innerHTML = '<i data-lucide="bookmark-plus"></i>Save to memory';
    b.addEventListener("click", async () => {
      try { await api("/api/memories", { method: "POST", headers: JSONH, body: JSON.stringify({ text: saveText }) });
        b.innerHTML = "Saved"; b.disabled = true; toast("Saved to memory"); loadStatus();
      } catch (e) { toast("Could not save: " + e.message, "bad"); }
    });
    act.appendChild(b); div.querySelector(".bubble").appendChild(act);
  }
  $("chat-log").appendChild(div); icons();
  $("chat-log").lastElementChild.scrollIntoView({ block: "end", behavior: "smooth" });
  return div;
}
async function sendChat() {
  const text = $("chat-in").value.trim();
  if (!text) return;
  $("chat-in").value = ""; autosize();
  const optsRaw = $("chat-opts").value.trim();
  const options = optsRaw ? optsRaw.split(",").map(s => s.trim()).filter(Boolean) : null;
  addMsg("user", text, text);
  if ($("auto-mem").checked) {
    try { await api("/api/memories", { method: "POST", headers: JSONH, body: JSON.stringify({ text }) }); loadStatus(); }
    catch (e) { toast("Auto-save failed: " + e.message, "bad"); }
  }
  const wait = addMsg("bot", "");
  wait.querySelector(".body").innerHTML = '<span class="typing"><b></b><b></b><b></b></span>';
  $("chat-send").disabled = true;
  try {
    const r = await api("/api/chat", { method: "POST", headers: JSONH, body: JSON.stringify({ message: text, options }) });
    wait.querySelector(".body").textContent = r.text;
    const bub = wait.querySelector(".bubble");
    const meta = document.createElement("div"); meta.className = "meta";
    meta.innerHTML = `<span class="pill ${r.mode === "local" ? "warn" : "good"}">${esc(r.mode)}</span><span class="pill">${esc(tr("intent", r.decision.intent))}</span>` +
      cites(r.citations || []);
    bub.appendChild(meta);
    const prop = r.proposal && r.proposal.intervention;
    if (prop && prop.level === 1 && prop.options_presented.length) {
      const box = document.createElement("div"); box.className = "actions";
      prop.options_presented.forEach(o => {
        const b = document.createElement("button"); b.className = "btn ghost sm"; b.textContent = o;
        b.addEventListener("click", () => { $("chat-in").value = `I choose: ${o}`; sendChat(); });
        box.appendChild(b);
      });
      bub.appendChild(box);
    }
  } catch (e) { wait.querySelector(".body").textContent = "Error: " + e.message; }
  $("chat-send").disabled = false; loadStatus(); icons();
}
function autosize() { const t = $("chat-in"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 160) + "px"; }
$("chat-in").addEventListener("input", autosize);
$("chat-in").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendChat(); } });
$("chat-send").addEventListener("click", sendChat);
$("opts-toggle").addEventListener("click", () => { const on = $("opts-box").classList.toggle("on"); $("opts-toggle").classList.toggle("on", on); if (on) $("chat-opts").focus(); });

/* Profile */
const chipsOf = (items, key) => `<div class="chips">${items.map(e => `<span class="chip">${esc(e[key])}<i>${e.count}</i></span>`).join("")}</div>`;
const groupsOf = (obj, key) => Object.keys(obj).length
  ? Object.keys(obj).map(k => `<div class="kind">${esc(k)}</div>${chipsOf(obj[k], key)}`).join("") : '<span class="muted">Nothing yet.</span>';
async function loadProfile() {
  const box = $("profile-body"); box.innerHTML = skel(3);
  try {
    const p = await api("/api/profile");
    const w = p.writing.stats, wr = p.writing;
    const meter = n => `<span class="meter">${[1, 2, 3, 4].map(i => `<b class="${i <= n ? "on" : ""}"></b>`).join("")}</span>`;
    const tend = p.tendencies.length ? p.tendencies.map(t => `<div class="tend"><div class="st">${esc(t.statement)}</div>
      <div class="mt">${meter(Math.min(t.supports, 4))}<span class="pill ${t.supports > 1 ? "good" : "warn"}">${esc(t.evidence_label)}</span>
      <span class="muted">${t.contradicts} counter-examples · ${esc(tr("domain", t.domain))}</span></div></div>`).join("") : '<span class="muted">Nothing yet.</span>';
    const endings = (w.endings || []).map(e => `<div class="bar"><span>${esc(e.name)}</span><span class="t"><div style="width:${Math.round(e.ratio * 100)}%"></div></span><span>${e.count} sentences</span></div>`).join("");
    const styles = wr.styles.length ? `<div class="chips" style="margin-bottom:12px">${wr.styles.map(s => `<span class="chip">${esc(s.pattern)}<i>${esc(s.intent)}</i></span>`).join("")}</div>` : "";
    const prefs = p.preferences.length ? `<div class="chips">${p.preferences.map(x => `<span class="chip">${esc(x.target)}<i>${x.direction === "+" ? "likes" : "dislikes"}</i></span>`).join("")}</div>` : '<span class="muted">Nothing yet.</span>';
    const crit = p.criteria.length ? p.criteria.map(x => `<div class="tend"><div class="st">${esc(x.statement)}</div><div class="muted">${esc(x.applies_to)}</div></div>`).join("") : '<span class="muted">Nothing yet.</span>';
    box.innerHTML = `<div class="pbanner"><i data-lucide="info"></i><div><b>${p.observations} memories · ${esc(day(p.period.from))} ~ ${esc(day(p.period.to))}</b>
      The fewer memories there are, the closer these are to guesses. One piece of evidence is shown as a candidate.</div></div>
      <div class="stack">
      <div class="card"><h3>What repeats in your memories</h3>${tend}</div>
      <div class="grid2"><div class="card"><h3>Things that come up often</h3>${groupsOf(p.entities, "name")}</div>
      <div class="card"><h3>Situations they appear in</h3>${groupsOf(p.situations, "value")}</div></div>
      <div class="grid2"><div class="card"><h3>Preferences</h3>${prefs}</div><div class="card"><h3>Decision criteria</h3>${crit}</div></div>
      <div class="card"><h3>Writing style</h3>${styles}
      ${w.sentences ? `<div class="muted" style="margin-bottom:8px">${w.sentences} sentences · avg ${w.avg_sentence_chars} chars · longest ${w.longest_sentence_chars} chars</div>${endings}` : ""}
      <div class="muted" style="margin-top:10px">Counted from ${w.observations} memories. To help with writing, add more of your own writing.</div></div></div>`;
  } catch (e) { box.innerHTML = empty("wifi-off", "Could not load", e.message); }
  icons();
}

/* Scenarios */
let SCEN = [], scenCur = null;
const SC_ICON = { doc_draft: "file-pen-line", music_recommend: "music", day_plan: "calendar-days", choice_help: "git-compare" };
async function loadScen() {
  if (!SCEN.length) { try { SCEN = (await api("/api/scenarios")).scenarios; } catch (e) { $("scen-pick").innerHTML = empty("wifi-off", "Could not load", e.message); return; } }
  $("scen-pick").innerHTML = SCEN.map(s => `<button class="sc${scenCur === s.id ? " on" : ""}" data-sc="${s.id}"><span class="ic"><i data-lucide="${SC_ICON[s.id] || "sparkles"}"></i></span><b>${esc(s.name)}</b><span>${esc(s.summary)}</span></button>`).join("");
  $("scen-pick").querySelectorAll(".sc").forEach(b => b.addEventListener("click", () => { scenCur = b.dataset.sc; $("scen-out").innerHTML = ""; loadScen(); }));
  const s = SCEN.find(x => x.id === scenCur);
  $("scen-form").innerHTML = s ? `<div class="card">${s.fields.map(f => {
    const id = `sc-${f.key}`;
    const ctl = f.kind === "select" ? `<select id="${id}">${f.options.map(o => `<option>${esc(o)}</option>`).join("")}</select>`
      : f.kind === "textarea" ? `<textarea id="${id}" rows="3" placeholder="${esc(f.placeholder)}"></textarea>`
      : `<input id="${id}" type="text" placeholder="${esc(f.placeholder)}">`;
    return `<div class="field"><label for="${id}">${esc(f.label)}${f.required ? ' <span style="color:var(--bad)">*</span>' : ""}</label>${ctl}</div>`;
  }).join("")}<button class="btn primary" id="sc-run"><i data-lucide="wand-sparkles"></i>Run</button></div>`
    : empty("sparkles", "Pick a scenario", "Choose what you want to do above and its fields will appear.");
  if (s) $("sc-run").addEventListener("click", () => runScen(s));
  icons();
}
async function runScen(s) {
  const inputs = {}; s.fields.forEach(f => { inputs[f.key] = $("sc-" + f.key).value; });
  $("sc-run").disabled = true; $("scen-out").innerHTML = '<div class="card" style="margin-top:12px"><span class="typing"><b></b><b></b><b></b></span> <span class="muted">Reading your memories and working on it</span></div>';
  try {
    const r = await api(`/api/scenarios/${s.id}/run`, { method: "POST", headers: JSONH, body: JSON.stringify({ inputs }) });
    $("scen-out").innerHTML = `<div class="card" style="margin-top:12px"><div class="result">${esc(r.text)}</div>
      <div class="result-meta"><span class="pill ${r.mode === "local" ? "warn" : "good"}">${esc(r.mode)}</span>
      ${cites(r.citations)}</div>
      ${r.note ? `<div class="muted" style="margin-top:8px">${esc(r.note)}</div>` : ""}</div>`;
  } catch (e) { $("scen-out").innerHTML = `<div class="card" style="margin-top:12px">${empty("circle-alert", "Could not run", e.message)}</div>`; }
  $("sc-run").disabled = false; icons();
}

/* Memory */
async function loadMems(q) {
  const list = $("mem-list"); list.innerHTML = skel(3);
  try {
    const data = await api("/api/memories?q=" + encodeURIComponent(q || ""));
    if (!data.items.length) { list.innerHTML = `<div class="card">${empty("library", q ? "No results" : "No memories yet", q ? "Try different words." : "Add your first memory above.")}</div>`; icons(); return; }
    list.innerHTML = "";
    data.items.forEach(o => {
      const div = document.createElement("div"); div.className = "item";
      div.innerHTML = `<div class="top"><div class="txt">${esc(o.text)}</div></div>
        <div class="foot"><span class="pill"><i data-lucide="calendar" style="width:12px;height:12px"></i>${esc(day(o.occurred_at) || "-")}</span><span class="id">${esc(o.id)}</span>
        ${o.score !== undefined ? `<span class="pill accent">relevance ${o.score}</span>` : ""}</div>`;
      const del = document.createElement("button"); del.className = "btn ghost icon danger sm"; del.setAttribute("aria-label", "Delete");
      del.innerHTML = '<i data-lucide="trash-2"></i>';
      del.addEventListener("click", async () => {
        if (!confirm("Delete this memory? What was learned from it will be removed too.")) return;
        try { await api("/api/memories/" + o.id, { method: "DELETE" }); toast("Deleted"); loadMems($("mem-q").value); loadStatus(); }
        catch (e) { toast("Could not delete: " + e.message, "bad"); }
      });
      div.querySelector(".top").appendChild(del); list.appendChild(div);
    });
  } catch (e) { list.innerHTML = `<div class="card">${empty("wifi-off", "Could not load", e.message)}</div>`; }
  icons();
}
$("mem-search").addEventListener("click", () => loadMems($("mem-q").value));
$("mem-q").addEventListener("keydown", e => { if (e.key === "Enter") loadMems($("mem-q").value); });
$("mem-add-btn").addEventListener("click", async () => {
  const t = $("mem-add").value.trim(); if (!t) return;
  const b = $("mem-add-btn"); b.disabled = true; b.textContent = "Reading...";
  try { await api("/api/memories", { method: "POST", headers: JSONH, body: JSON.stringify({ text: t }) });
    $("mem-add").value = ""; toast("Memory added"); loadMems(); loadStatus();
  } catch (e) { toast("Could not add: " + e.message, "bad"); }
  b.disabled = false; b.innerHTML = '<i data-lucide="plus"></i>Add memory'; icons();
});

/* Graph */
const KCOL = { Observation: "#6bb3e0", Entity: "#e3b341", Context: "#a78bdb", Preference: "#4cc38a", Criterion: "#ee8a8a", Hypothesis: "#f09a55", Style: "#9aa8a6", Correction: "#e06666" };
const KKO = { Observation: "Memory", Entity: "Thing", Context: "Situation", Preference: "Preference", Criterion: "Criterion", Hypothesis: "Hypothesis", Style: "Style", Correction: "Correction" };
let cy = null;
async function loadGraph() {
  if (cy) { cy.resize(); return; }
  $("legend").innerHTML = Object.keys(KCOL).filter(k => k !== "Correction").map(k => `<span><b style="background:${KCOL[k]}"></b>${KKO[k]}</span>`).join("");
  if (typeof cytoscape === "undefined") { $("cy-note").innerHTML = empty("wifi-off", "Could not load the graph library", "Check your internet connection."); icons(); return; }
  let data; try { data = await api("/api/graph"); } catch (e) { $("cy-note").innerHTML = empty("wifi-off", "Could not load", e.message); icons(); return; }
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const txt = dark ? "#dbe9e7" : "#1b2c2b", edge = dark ? "#3a5250" : "#c3d0ce";
  const short = s => (s.length > 14 ? s.slice(0, 14) + "…" : s);
  cy = cytoscape({ container: $("cy"),
    elements: [...data.nodes.map(n => ({ data: { id: n.id, kind: n.kind, full: n.label, label: short(n.label), color: KCOL[n.kind] || "#9aa8a6" } })),
      ...data.edges.map((e, i) => ({ data: { id: "e" + i, source: e.source, target: e.target, label: e.rel === "RELATED_TO" ? (e.phrase || e.rel) : e.rel } }))],
    style: [
      { selector: "node", style: { "background-color": "data(color)", label: "data(label)", "font-size": 12, "min-zoomed-font-size": 7, "font-family": "Pretendard Variable, sans-serif", color: txt,
        "text-valign": "bottom", "text-margin-y": 6, width: 22, height: 22, "border-width": 2, "border-color": dark ? "#111d1c" : "#fff", "text-outline-width": 3, "text-outline-color": dark ? "#0b1413" : "#f1f5f4" } },
      { selector: 'node[kind = "Hypothesis"]', style: { width: 30, height: 30, shape: "round-rectangle" } },
      { selector: 'node[kind = "Observation"]', style: { width: 14, height: 14, label: "" } },
      { selector: "edge", style: { width: 1.3, "line-color": edge, "target-arrow-color": edge, "target-arrow-shape": "triangle", "arrow-scale": .8, "curve-style": "bezier", "font-size": 9, color: txt, "text-background-color": dark ? "#111d1c" : "#fff", "text-background-opacity": .9, "text-background-padding": 2 } },
      { selector: ".dim", style: { opacity: .12 } },
      { selector: "edge.hi", style: { label: "data(label)", "line-color": "#0f766e", "target-arrow-color": "#0f766e", width: 2, opacity: 1 } },
      { selector: "node.hi", style: { opacity: 1 } },
      { selector: "node.sel", style: { "border-color": "#0f766e", "border-width": 4 } },
    ],
    layout: { name: "cose", animate: false, nodeRepulsion: 4200, idealEdgeLength: 55, gravity: 1.4, componentSpacing: 30, numIter: 1500, padding: 24 }, wheelSensitivity: .25 });
  cy.on("tap", "node", ev => {
    const n = ev.target, nb = n.closedNeighborhood();
    cy.elements().addClass("dim").removeClass("hi sel"); nb.removeClass("dim").addClass("hi"); n.addClass("sel");
    const rel = n.connectedEdges().map(e => { const o = e.source().id() === n.id() ? e.target() : e.source(); return `<span class="chip">${esc(e.data("label"))} · ${esc(KKO[o.data("kind")] || "")} ${esc(short(o.data("full")))}</span>`; });
    $("cy-note").innerHTML = `<span class="pill accent">${esc(KKO[n.data("kind")] || n.data("kind"))}</span> <span class="id">${esc(n.id())}</span>
      <div style="margin:8px 0 10px">${esc(n.data("full"))}</div><div class="chips">${rel.join("") || '<span class="muted">No connections</span>'}</div>`;
  });
  cy.on("tap", ev => { if (ev.target === cy) { cy.elements().removeClass("dim hi sel"); $("cy-note").innerHTML = '<span class="muted">Tap a node to see what it connects to.</span>'; } });
}

/* Hypotheses */
async function loadHyps() {
  const list = $("hyp-list"); list.innerHTML = skel(3);
  try {
    const data = await api("/api/hypotheses");
    if (!data.hypotheses.length) { list.innerHTML = `<div class="card">${empty("lightbulb", "No hypotheses yet", "Patterns show up here once memories pile up.")}</div>`; icons(); return; }
    list.innerHTML = "";
    const tone = { active: ["good", "Promoted"], candidate: ["warn", "Candidate"], suspended: ["", "On hold"] };
    data.hypotheses.forEach(h => {
      const t = tone[h.status] || ["", h.status];
      const div = document.createElement("div"); div.className = "item";
      div.innerHTML = `<div class="top"><div class="txt" style="font-weight:600">${esc(h.statement)}</div><span class="pill ${t[0]}">${esc(t[1])}</span></div>
        <div class="foot"><span class="pill accent">${h.supports.length} evidence</span><span class="pill ${h.contradicts.length ? "bad" : ""}">${h.contradicts.length} counter-examples</span>
        <span class="pill">${esc(tr("domain", h.domain) || "-")}</span><span class="id">${esc(h.id)}</span></div>
        <div>${h.supports.map(s => `<div class="ev sup"><i data-lucide="plus-circle"></i><div><small>${esc(day(s.occurred_at))}</small>${esc(s.text)}</div></div>`).join("")}
        ${h.contradicts.map(s => `<div class="ev con"><i data-lucide="minus-circle"></i><div><small>${esc(day(s.occurred_at))}</small>${esc(s.text)}</div></div>`).join("")}</div>`;
      const seg = document.createElement("div"); seg.className = "seg"; seg.style.alignSelf = "flex-start";
      [["Correct", "ok", "correct"], ["Wrong", "no", "wrong"], ["Don't use", "stop", "dont_use"]].forEach(([v, c, code]) => {
        const b = document.createElement("button"); b.className = c; b.textContent = v;
        b.addEventListener("click", async () => {
          try { await api(`/api/hypotheses/${h.id}/feedback`, { method: "POST", headers: JSONH, body: JSON.stringify({ verdict: code }) });
            toast(`Marked as "${v}"`); loadHyps(); loadStatus(); } catch (e) { toast("Could not apply: " + e.message, "bad"); }
        });
        seg.appendChild(b);
      });
      div.appendChild(seg); list.appendChild(div);
    });
  } catch (e) { list.innerHTML = `<div class="card">${empty("wifi-off", "Could not load", e.message)}</div>`; }
  icons();
}

/* Relations */
async function loadRels() {
  const box = $("rel-list");
  try {
    const data = await api("/api/relations");
    if (!data.vocabulary.length) { box.innerHTML = empty("link-2", "No relations yet", "Relationships between things appear here once they are extracted."); icons(); return; }
    box.innerHTML = `<div class="tw"><table class="tbl"><tr><th>Phrase</th><th>Count</th><th>Example</th></tr>${data.vocabulary.map(v => { const x = v.examples[0] || {};
      return `<tr><td>${esc(v.phrase)}</td><td class="n">${v.count}</td><td class="muted">${esc(x.from || "")} → ${esc(x.to || "")}</td></tr>`; }).join("")}</table></div>`;
  } catch (e) { box.innerHTML = empty("wifi-off", "Could not load", e.message); }
  icons();
}

/* Report */
function renderMd(md) {
  const lines = (md || "").split("\n"); let html = "";
  lines.forEach(l => {
    if (!l.trim()) return;
    if (l.startsWith("# ")) return;
    if (l.startsWith("## ")) html += `<h3>${esc(l.slice(3))}</h3>`;
    else if (l.startsWith("- ")) {
      const m = l.slice(2).match(/^\[(\w+)\]\s*(.*?)(?:\s*\((evidence[^)]*)\))?$/);
      html += m ? `<div class="li"><span class="pill ${m[1] === "active" ? "good" : "warn"}">${esc(m[1])}</span><span>${esc(m[2])}</span><small>${esc(m[3] || "")}</small></div>` : `<div class="li">${esc(l.slice(2))}</div>`;
    } else if (/^\d{4}-\d\d-\d\d/.test(l)) html += `<div class="range">${esc(l)}</div>`;
    else html += `<div class="muted" style="margin-top:12px">${esc(l)}</div>`;
  });
  return html || empty("clipboard-check", "Nothing changed this week", "");
}
async function loadReport() {
  $("report-body").innerHTML = skel(1);
  try { $("report-body").innerHTML = renderMd((await api("/api/report")).markdown); } catch (e) { $("report-body").innerHTML = empty("wifi-off", "Could not load", e.message); }
  icons();
}
