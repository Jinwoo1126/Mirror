# Fly.io app config.
app = "mirror-jinwoo1126"
primary_region = "nrt"          # Tokyo, closest Fly region to Korea

[build]

[env]
  MIRROR_HOSTED = "1"
  MIRROR_EXTRACTOR = "spark"
  MIRROR_LLM_TRANSPORT = "http"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

[[http_service.checks]]
  method = "GET"
  path = "/healthz"
  interval = "30s"
  timeout = "3s"
  grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
